<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paleta Editorial</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23B8956A'/><text x='50' y='65' font-size='60' font-weight='700' text-anchor='middle' fill='%238B6C45' font-family='serif'>P</text></svg>" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, writeBatch, query, where, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCpMu7V43IrtKhyYMXFlcz7VKhdvXZ2tYw",
    authDomain: "paleta-yasmim.firebaseapp.com",
    projectId: "paleta-yasmim",
    storageBucket: "paleta-yasmim.firebasestorage.app",
    messagingSenderId: "653028129243",
    appId: "1:653028129243:web:d1e2b021489ba023180ffe"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window._app = { db, auth };
  window._user = null;
  window._tenantId = null;
  window._tenant = null;
  window._currentView = 'calendar';
  window._editMode = false;

  window._signIn = async (email, password) => {
    const result = await signInWithEmailAndPassword(auth, email, password);
    return result.user;
  };

  window._signOut = async () => {
    await signOut(auth);
  };

  window._getTenant = async (tenantId) => {
    const docSnap = await getDoc(doc(db, 'tenants', tenantId));
    return docSnap.exists() ? { id: docSnap.id, ...docSnap.data() } : null;
  };

  window._getUserTenants = async (userId) => {
    try {
      const userDoc = await getDoc(doc(db, 'users', userId));
      if (!userDoc.exists()) return [];
      const tenantIds = userDoc.data().tenantIds || [userDoc.data().tenantId];
      const tenants = await Promise.all(tenantIds.map(id => window._getTenant(id)));
      return tenants.filter(t => t);
    } catch (error) {
      console.warn('Erro ao buscar tenants:', error);
      return [];
    }
  };

  window._getPosts = async (tenantId) => {
    const q = query(collection(db, 'posts'), where('tenantId', '==', tenantId));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };

  window._savePost = async (tenantId, data) => {
    data.tenantId = tenantId;
    data.updatedAt = new Date();
    if (data.id) {
      await updateDoc(doc(db, 'posts', data.id), data);
    } else {
      data.createdAt = new Date();
      const ref = await addDoc(collection(db, 'posts'), data);
      return ref.id;
    }
  };

  window._deletePost = async (postId) => {
    await deleteDoc(doc(db, 'posts', postId));
  };

  onAuthStateChanged(auth, async (user) => {
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');

    if (user) {
      window._user = user;
      window._tenantId = 'default-tenant';
      window._tenant = { id: 'default-tenant', name: 'Calendário Editorial' };
      window._tenants = [{ id: 'default-tenant', name: 'Calendário Editorial' }];

      loginScreen.style.display = 'none';
      appScreen.style.display = 'flex';
      window._renderApp();
    } else {
      window._user = null;
      window._tenantId = null;
      window._tenant = null;
      loginScreen.style.display = 'flex';
      appScreen.style.display = 'none';
    }
  });

  window._renderApp = async () => {
    const appScreen = document.getElementById('app-screen');

    switch(window._currentView) {
      case 'calendar':
        await window._renderCalendar();
        break;
      case 'settings':
        await window._renderSettings();
        break;
      case 'admin':
        await window._renderAdmin();
        break;
    }
  };

  window._renderCalendar = async () => {
    const container = document.getElementById('view-content');
    let posts = [];

    try {
      if (window._tenantId) {
        posts = await window._getPosts(window._tenantId);
      }
    } catch (e) {
      console.warn('Erro ao carregar posts:', e);
    }

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();

    const monthName = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][month];

    let html = `
      <div class="calendar-header">
        <h2>${monthName} ${year}</h2>
        <button class="btn-primary" onclick="window._openNewPost()">+ Novo Post</button>
      </div>
      <div class="posts-grid">
    `;

    if (posts.length === 0) {
      html += '<div class="empty-state">Nenhum post neste período. Clique em "+ Novo Post" para começar!</div>';
    } else {
      posts.forEach(post => {
        const date = new Date(post.date?.toDate?.() || post.date);
        html += `
          <div class="post-card" data-post-id="${post.id}">
            <div class="post-type post-type-${post.type}">${post.type}</div>
            ${post.image ? `<img src="${post.image}" alt="Post">` : '<div class="post-no-image">Sem imagem</div>'}
            <div class="post-info">
              <div class="post-date">${date.toLocaleDateString('pt-BR')}</div>
              <div class="post-title">${post.title || 'Sem título'}</div>
              <div class="post-caption">${(post.caption || '').substring(0, 80)}...</div>
              ${window._editMode ? `
                <div class="post-actions">
                  <button class="btn-small" onclick="window._editPost('${post.id}')">Editar</button>
                  <button class="btn-small btn-danger" onclick="window._confirmDelete('${post.id}')">Deletar</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });
    }

    html += '</div>';
    container.innerHTML = html;
  };

  window._renderSettings = async () => {
    const container = document.getElementById('view-content');

    container.innerHTML = `
      <div class="settings-panel">
        <h2>Configurações</h2>

        <div class="settings-section">
          <h3>Informações do Tenant</h3>
          <div class="settings-group">
            <label>Nome</label>
            <input type="text" value="Calendário Editorial" placeholder="Nome do cliente">
          </div>
          <div class="settings-group">
            <label>Plano</label>
            <select>
              <option value="free">Gratuito</option>
              <option value="pro" selected>Pro</option>
              <option value="enterprise">Enterprise</option>
            </select>
          </div>
          <button class="btn-primary" onclick="alert('Configurações salvas!')">Salvar Configurações</button>
        </div>

        <div class="settings-section">
          <h3>Sobre</h3>
          <div class="admin-info">
            <p><strong>Plataforma:</strong> Calendário Editorial Multi-tenant</p>
            <p><strong>Versão:</strong> 2.0</p>
            <p><strong>Status:</strong> ✅ Ativo e funcionando</p>
          </div>
        </div>
      </div>
    `;
  };

  window._renderAdmin = async () => {
    const container = document.getElementById('view-content');

    container.innerHTML = `
      <div class="admin-panel">
        <h2>Painel de Administração</h2>

        <div class="admin-section">
          <h3>Gerenciar Usuários</h3>
          <p style="color: #666; margin-bottom: 16px;">Funcionalidade em desenvolvimento</p>
          <button class="btn-primary" onclick="alert('Em desenvolvimento')">+ Novo Usuário</button>
        </div>

        <div class="admin-section">
          <h3>Gerenciar Tenants</h3>
          <p style="color: #666; margin-bottom: 16px;">Funcionalidade em desenvolvimento</p>
          <button class="btn-primary" onclick="alert('Em desenvolvimento')">+ Novo Tenant</button>
        </div>

        <div class="admin-section">
          <h3>Sistema</h3>
          <div class="admin-info">
            <p><strong>Usuário:</strong> ${window._user?.email}</p>
            <p><strong>Tenant Ativo:</strong> ${window._tenant?.name}</p>
            <p><strong>Versão:</strong> 2.0 Multi-tenant</p>
            <p><strong>Status:</strong> ✅ Operacional</p>
          </div>
        </div>
      </div>
    `;
  };

  window._switchTenant = async (tenantId) => {
    window._tenantId = tenantId;
    window._tenant = window._tenants.find(t => t.id === tenantId);
    document.getElementById('tenant-select').value = tenantId;
    await window._renderApp();
  };

  window._openNewPost = () => {
    const modal = document.getElementById('new-post-modal');
    if (modal) {
      modal.style.display = 'flex';
      document.getElementById('post-title').value = '';
      document.getElementById('post-caption').value = '';
      document.getElementById('post-date').value = new Date().toISOString().split('T')[0];
    }
  };

  window._closeModal = () => {
    const modal = document.getElementById('new-post-modal');
    if (modal) modal.style.display = 'none';
  };

  window._saveNewPost = async () => {
    const title = document.getElementById('post-title').value;
    const caption = document.getElementById('post-caption').value;
    const date = document.getElementById('post-date').value;
    const type = document.getElementById('post-type').value;
    const image = document.getElementById('post-image').value;

    if (!title || !date) {
      alert('Preencha título e data!');
      return;
    }

    try {
      await window._savePost(window._tenantId, {
        title,
        caption,
        date: new Date(date),
        type,
        image,
      });
      alert('Post criado com sucesso!');
      window._closeModal();
      await window._renderCalendar();
    } catch (error) {
      alert('Erro ao criar post: ' + error.message);
    }
  };

  window._editPost = (postId) => {
    alert('Editando post: ' + postId);
  };

  window._confirmDelete = (postId) => {
    if (confirm('Tem certeza que deseja deletar este post?')) {
      window._deletePost(postId).then(() => window._renderCalendar());
    }
  };

  window._saveSettings = async () => {
    const name = document.getElementById('tenant-name')?.value;
    const plan = document.getElementById('tenant-plan')?.value;

    if (name) {
      await updateDoc(doc(db, 'tenants', window._tenantId), { name, plan, updatedAt: new Date() });
      window._tenant.name = name;
      window._tenant.plan = plan;
      alert('Configurações salvas!');
      await window._renderApp();
    }
  };

  window._handleLogin = async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');

    try {
      errorEl.style.display = 'none';
      await window._signIn(email, password);
    } catch (error) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Email ou senha incorretos';
    }
  };

  window._handleLogout = async () => {
    if (confirm('Deseja sair?')) {
      await window._signOut();
    }
  };

  window._toggleEditMode = () => {
    window._editMode = !window._editMode;
    document.getElementById('edit-toggle').classList.toggle('active', window._editMode);
    window._renderApp();
  };

  window._setView = (view) => {
    window._currentView = view;
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-view="${view}"]`)?.classList.add('active');
    window._renderApp();
  };

  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
  :root {
    --gold: #B8956A;
    --gold-light: #E8D8C0;
    --gold-dark: #8B6C45;
    --ivory: #F8F5F0;
    --cream: #EDE9E1;
    --text: #1E1A16;
    --text-muted: #7A6E63;
    --text-light: #A8998C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--ivory);
    color: var(--text);
    line-height: 1.6;
  }

  /* LOGIN SCREEN */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 100%);
    display: none;
  }

  .login-container {
    background: var(--ivory);
    padding: 48px;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
  }

  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .login-header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--gold-dark);
    font-family: 'Playfair Display', serif;
    margin-bottom: 8px;
  }

  .login-header p {
    color: var(--text-muted);
    font-size: 14px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-weight: 500;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184, 149, 106, 0.1);
  }

  .btn-login {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    font-size: 14px;
  }

  .btn-login:hover {
    background: var(--gold-dark);
  }

  #login-error {
    display: none;
    background: #fee;
    color: #c33;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 13px;
  }

  /* APP SCREEN */
  #app-screen {
    display: none;
    flex-direction: row;
    min-height: 100vh;
  }

  .sidebar {
    width: 260px;
    background: var(--ivory);
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-header {
    padding: 24px 20px;
    border-bottom: 1px solid #e5e7eb;
  }

  .sidebar-brand {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
  }

  .sidebar-brand-sub {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 4px;
  }

  .tenant-selector {
    margin: 16px 0 0 0;
    padding: 12px;
    background: #f3f4f6;
    border-radius: 8px;
    border: none;
    width: 100%;
    cursor: pointer;
    font-size: 13px;
    color: #374151;
  }

  .sidebar-nav {
    flex: 1;
    padding: 16px 0;
  }

  .sidebar-item {
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 3px solid transparent;
    color: #6b7280;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-item:hover {
    background: #f9fafb;
    color: var(--gold);
  }

  .sidebar-item.active {
    background: #f3f4f6;
    border-left-color: var(--gold);
    color: var(--gold);
    font-weight: 600;
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid #e5e7eb;
  }

  .btn-logout {
    width: 100%;
    padding: 10px;
    background: #fee;
    color: #dc2626;
    border: 1px solid #fca5a5;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.2s;
  }

  .btn-logout:hover {
    background: #fecaca;
  }

  /* MAIN CONTENT */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header-bar {
    background: var(--ivory);
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-bar h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1f2937;
  }

  .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  #edit-toggle {
    padding: 8px 16px;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }

  #edit-toggle.active {
    background: #fef3c7;
    border-color: #fcd34d;
    color: #92400e;
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: #6b7280;
  }

  .user-avatar {
    width: 36px;
    height: 36px;
    background: var(--gold);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
  }

  #view-content {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
  }

  /* CALENDAR VIEW */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .calendar-header h2 {
    font-size: 28px;
    font-weight: 700;
  }

  .posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .post-card {
    background: var(--ivory);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
  }

  .post-card:hover {
    border-color: var(--gold);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
  }

  .post-type {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    z-index: 2;
  }

  .post-type-reel {
    background: #fee;
    color: #c33;
  }

  .post-type-carousel {
    background: #efe;
    color: #3c3;
  }

  .post-type-static {
    background: #eef;
    color: #33c;
  }

  .post-card img,
  .post-no-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
  }

  .post-info {
    padding: 16px;
  }

  .post-date {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 6px;
  }

  .post-title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 6px;
    color: #1f2937;
  }

  .post-caption {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.4;
  }

  .post-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .btn-small {
    flex: 1;
    padding: 6px 12px;
    background: #f3f4f6;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-small:hover {
    background: #e5e7eb;
  }

  .btn-small.btn-danger {
    background: #fee;
    color: #c33;
  }

  .btn-small.btn-danger:hover {
    background: #fdd;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #9ca3af;
  }

  /* SETTINGS & ADMIN */
  .settings-panel,
  .admin-panel {
    max-width: 800px;
  }

  .settings-panel h2,
  .admin-panel h2 {
    font-size: 24px;
    margin-bottom: 28px;
  }

  .settings-section,
  .admin-section {
    background: var(--ivory);
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    margin-bottom: 20px;
  }

  .settings-section h3,
  .admin-section h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: #1f2937;
  }

  .settings-group {
    margin-bottom: 16px;
  }

  .settings-group label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
    font-size: 13px;
    color: #374151;
  }

  .settings-group input,
  .settings-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 13px;
  }

  .settings-group input:focus,
  .settings-group select:focus {
    outline: none;
    border-color: var(--gold);
  }

  .tenants-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .tenant-item {
    padding: 12px;
    background: #f9fafb;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid #e5e7eb;
  }

  .tenant-item:hover {
    background: #f3f4f6;
    border-color: var(--gold);
  }

  .tenant-name {
    font-weight: 600;
    font-size: 14px;
    color: #1f2937;
  }

  .tenant-meta {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
  }

  .admin-info p {
    padding: 8px 0;
    font-size: 13px;
    color: #6b7280;
  }

  .btn-primary {
    padding: 10px 20px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
    margin-top: 16px;
  }

  .btn-primary:hover {
    background: var(--gold-dark);
  }

  .sidebar-logo {
    width: 56px;
    height: 56px;
    margin-bottom: 12px;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .sidebar { width: 200px; }
    .posts-grid { grid-template-columns: 1fr; }
    #view-content { padding: 20px; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-container">
    <div class="login-header">
      <h1>Paleta Editorial</h1>
      <p>Platform de Calendário Editorial Multi-tenant</p>
    </div>

    <form onsubmit="window._handleLogin(event)">
      <div id="login-error"></div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <svg class="sidebar-logo" viewBox="0 0 240 100" xmlns="http://www.w3.org/2000/svg">
        <!-- "paleta" em vermelho vivo -->
        <text x="5" y="70" font-size="56" font-weight="800" fill="#C74444" font-family="'Inter', sans-serif" letter-spacing="-1.5">paleta</text>
        <!-- "mkt" em azul/verde escuro -->
        <text x="145" y="70" font-size="56" font-weight="800" fill="#1B5E6F" font-family="'Inter', sans-serif" letter-spacing="-1.5">mkt</text>
      </svg>
      <div class="sidebar-brand" style="color: #1E1A16; margin-top: 8px; font-size: 14px;">Calendário Editorial</div>
      <div class="sidebar-brand-sub" style="font-size: 11px;">Platform Multi-tenant</div>
      <select class="tenant-selector" id="tenant-select" onchange="window._switchTenant(this.value)">
        <option>Carregando tenants...</option>
      </select>
    </div>

    <div class="sidebar-nav">
      <div class="sidebar-item active" data-view="calendar" onclick="window._setView('calendar')">
        📅 Calendário
      </div>
      <div class="sidebar-item" data-view="settings" onclick="window._setView('settings')">
        ⚙️ Configurações
      </div>
      <div class="sidebar-item" data-view="admin" onclick="window._setView('admin')">
        👨‍💼 Admin
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="btn-logout" onclick="window._handleLogout()">Logout</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="header-bar">
      <h1 id="view-title">Calendário Editorial</h1>
      <div class="header-actions">
        <button id="edit-toggle" onclick="window._toggleEditMode()">✏️ Modo Edição</button>
        <div class="user-info">
          <span id="user-email">user@email.com</span>
          <div class="user-avatar" id="user-avatar">U</div>
        </div>
      </div>
    </div>

    <div id="view-content">
      Carregando...
    </div>
  </div>
</div>

<!-- MODAL: NOVO POST -->
<div id="new-post-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
  <div style="background: white; border-radius: 12px; padding: 32px; max-width: 500px; width: 90%;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2 style="margin: 0; font-size: 20px;">Novo Post</h2>
      <button onclick="window._closeModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">✕</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 13px;">Título *</label>
        <input type="text" id="post-title" placeholder="Título do post" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">
      </div>

      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 13px;">Tipo</label>
        <select id="post-type" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">
          <option value="reel">Reel</option>
          <option value="carousel">Carrossel</option>
          <option value="static">Static</option>
        </select>
      </div>

      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 13px;">Data *</label>
        <input type="date" id="post-date" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">
      </div>

      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 13px;">URL da Imagem</label>
        <input type="url" id="post-image" placeholder="https://..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">
      </div>

      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 13px;">Legenda</label>
        <textarea id="post-caption" placeholder="Descrição do post..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; min-height: 80px; font-family: inherit;"></textarea>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button onclick="window._closeModal()" style="flex: 1; padding: 10px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">Cancelar</button>
        <button onclick="window._saveNewPost()" style="flex: 1; padding: 10px; background: var(--gold); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">Salvar Post</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Atualizar seletor de tenants e info do usuário após carregar
  setTimeout(() => {
    if (window._tenants && window._tenants.length > 0) {
      const select = document.getElementById('tenant-select');
      select.innerHTML = window._tenants.map(t => `
        <option value="${t.id}" ${t.id === window._tenantId ? 'selected' : ''}>${t.name}</option>
      `).join('');
    }

    if (window._user) {
      document.getElementById('login-email').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('user-email').textContent = window._user.email;
      const avatar = document.getElementById('user-avatar');
      avatar.textContent = window._user.email.charAt(0).toUpperCase();
    }
  }, 100);

  // Fechar modal ao clicar fora
  document.getElementById('new-post-modal')?.addEventListener('click', (e) => {
    if (e.target.id === 'new-post-modal') window._closeModal();
  });
</script>

</body>
</html>
