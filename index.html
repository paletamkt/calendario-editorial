<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paleta Editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, writeBatch, query, where, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCpMu7V43IrtKhyYMXFlcz7VKhdvXZ2tYw",
    authDomain: "paleta-yasmim.firebaseapp.com",
    projectId: "paleta-yasmim",
    storageBucket: "paleta-yasmim.firebasestorage.app",
    messagingSenderId: "653028129243",
    appId: "1:653028129243:web:d1e2b021489ba023180ffe"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window._app = { db, auth };
  window._user = null;
  window._tenantId = null;
  window._tenant = null;
  window._currentView = 'calendar';
  window._editMode = false;

  window._signIn = async (email, password) => {
    const result = await signInWithEmailAndPassword(auth, email, password);
    return result.user;
  };

  window._signOut = async () => {
    await signOut(auth);
  };

  window._getTenant = async (tenantId) => {
    const doc = await getDoc(getDoc(db, 'tenants', tenantId));
    return doc.exists() ? { id: doc.id, ...doc.data() } : null;
  };

  window._getUserTenants = async (userId) => {
    const userDoc = await getDoc(doc(db, 'users', userId));
    if (!userDoc.exists()) return [];
    const tenantIds = userDoc.data().tenantIds || [userDoc.data().tenantId];
    const tenants = await Promise.all(tenantIds.map(id => window._getTenant(id)));
    return tenants.filter(t => t);
  };

  window._getPosts = async (tenantId) => {
    const q = query(collection(db, 'posts'), where('tenantId', '==', tenantId));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };

  window._savePost = async (tenantId, data) => {
    data.tenantId = tenantId;
    data.updatedAt = new Date();
    if (data.id) {
      await updateDoc(doc(db, 'posts', data.id), data);
    } else {
      data.createdAt = new Date();
      const ref = await addDoc(collection(db, 'posts'), data);
      return ref.id;
    }
  };

  window._deletePost = async (postId) => {
    await deleteDoc(doc(db, 'posts', postId));
  };

  onAuthStateChanged(auth, async (user) => {
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');

    if (user) {
      window._user = user;
      const tenants = await window._getUserTenants(user.uid);
      window._tenants = tenants;

      if (tenants.length > 0) {
        window._tenantId = tenants[0].id;
        window._tenant = tenants[0];
      }

      loginScreen.style.display = 'none';
      appScreen.style.display = 'flex';
      window._renderApp();
    } else {
      window._user = null;
      window._tenantId = null;
      window._tenant = null;
      loginScreen.style.display = 'flex';
      appScreen.style.display = 'none';
    }
  });

  window._renderApp = async () => {
    const appScreen = document.getElementById('app-screen');

    switch(window._currentView) {
      case 'calendar':
        await window._renderCalendar();
        break;
      case 'settings':
        await window._renderSettings();
        break;
      case 'admin':
        await window._renderAdmin();
        break;
    }
  };

  window._renderCalendar = async () => {
    const posts = await window._getPosts(window._tenantId);
    const container = document.getElementById('view-content');

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();

    const monthName = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][month];

    let html = `
      <div class="calendar-header">
        <h2>${monthName} ${year}</h2>
        <button class="btn-primary" onclick="window._openNewPost()">+ Novo Post</button>
      </div>
      <div class="posts-grid">
    `;

    if (posts.length === 0) {
      html += '<div class="empty-state">Nenhum post neste período</div>';
    } else {
      posts.forEach(post => {
        const date = new Date(post.date?.toDate?.() || post.date);
        html += `
          <div class="post-card" data-post-id="${post.id}">
            <div class="post-type post-type-${post.type}">${post.type}</div>
            ${post.image ? `<img src="${post.image}" alt="Post">` : '<div class="post-no-image">Sem imagem</div>'}
            <div class="post-info">
              <div class="post-date">${date.toLocaleDateString('pt-BR')}</div>
              <div class="post-title">${post.title || 'Sem título'}</div>
              <div class="post-caption">${(post.caption || '').substring(0, 80)}...</div>
              ${window._editMode ? `
                <div class="post-actions">
                  <button class="btn-small" onclick="window._editPost('${post.id}')">Editar</button>
                  <button class="btn-small btn-danger" onclick="window._confirmDelete('${post.id}')">Deletar</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });
    }

    html += '</div>';
    container.innerHTML = html;
  };

  window._renderSettings = async () => {
    const container = document.getElementById('view-content');
    const tenant = window._tenant;

    container.innerHTML = `
      <div class="settings-panel">
        <h2>Configurações</h2>

        <div class="settings-section">
          <h3>Informações do Tenant</h3>
          <div class="settings-group">
            <label>Nome</label>
            <input type="text" id="tenant-name" value="${tenant.name || ''}" placeholder="Nome do cliente">
          </div>
          <div class="settings-group">
            <label>Slug</label>
            <input type="text" id="tenant-slug" value="${tenant.slug || ''}" placeholder="slug-do-cliente" disabled>
          </div>
          <div class="settings-group">
            <label>Plano</label>
            <select id="tenant-plan">
              <option value="free" ${tenant.plan === 'free' ? 'selected' : ''}>Gratuito</option>
              <option value="pro" ${tenant.plan === 'pro' ? 'selected' : ''}>Pro</option>
              <option value="enterprise" ${tenant.plan === 'enterprise' ? 'selected' : ''}>Enterprise</option>
            </select>
          </div>
          <button class="btn-primary" onclick="window._saveSettings()">Salvar Configurações</button>
        </div>

        <div class="settings-section">
          <h3>Outros Tenants</h3>
          <div class="tenants-list">
            ${(window._tenants || []).map(t => `
              <div class="tenant-item" onclick="window._switchTenant('${t.id}')">
                <div class="tenant-name">${t.name}</div>
                <div class="tenant-meta">${t.plan || 'free'} • ${t.slug}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  };

  window._renderAdmin = async () => {
    const container = document.getElementById('view-content');

    container.innerHTML = `
      <div class="admin-panel">
        <h2>Painel de Administração</h2>

        <div class="admin-section">
          <h3>Gerenciar Usuários</h3>
          <div id="users-list" class="users-list">Carregando usuários...</div>
          <button class="btn-primary" onclick="window._openNewUser()">+ Novo Usuário</button>
        </div>

        <div class="admin-section">
          <h3>Gerenciar Tenants</h3>
          <div id="tenants-list" class="tenants-admin-list">Carregando tenants...</div>
          <button class="btn-primary" onclick="window._openNewTenant()">+ Novo Tenant</button>
        </div>

        <div class="admin-section">
          <h3>Sistema</h3>
          <div class="admin-info">
            <p>Usuário: ${window._user?.email}</p>
            <p>Tenant Ativo: ${window._tenant?.name}</p>
            <p>Versão: 2.0 Multi-tenant</p>
          </div>
        </div>
      </div>
    `;
  };

  window._switchTenant = async (tenantId) => {
    window._tenantId = tenantId;
    window._tenant = window._tenants.find(t => t.id === tenantId);
    await window._renderApp();
  };

  window._openNewPost = () => {
    // Será implementado
    alert('Modal de novo post');
  };

  window._editPost = (postId) => {
    alert('Editando post: ' + postId);
  };

  window._confirmDelete = (postId) => {
    if (confirm('Tem certeza que deseja deletar este post?')) {
      window._deletePost(postId).then(() => window._renderCalendar());
    }
  };

  window._saveSettings = async () => {
    const name = document.getElementById('tenant-name')?.value;
    const plan = document.getElementById('tenant-plan')?.value;

    if (name) {
      await updateDoc(doc(db, 'tenants', window._tenantId), { name, plan, updatedAt: new Date() });
      window._tenant.name = name;
      window._tenant.plan = plan;
      alert('Configurações salvas!');
      await window._renderApp();
    }
  };

  window._handleLogin = async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');

    try {
      errorEl.style.display = 'none';
      await window._signIn(email, password);
    } catch (error) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Email ou senha incorretos';
    }
  };

  window._handleLogout = async () => {
    if (confirm('Deseja sair?')) {
      await window._signOut();
    }
  };

  window._toggleEditMode = () => {
    window._editMode = !window._editMode;
    document.getElementById('edit-toggle').classList.toggle('active', window._editMode);
    window._renderApp();
  };

  window._setView = (view) => {
    window._currentView = view;
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-view="${view}"]`)?.classList.add('active');
    window._renderApp();
  };

  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: #f8f9fa;
    color: #1f2937;
    line-height: 1.6;
  }

  /* LOGIN SCREEN */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: none;
  }

  .login-container {
    background: white;
    padding: 48px;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
  }

  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .login-header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #667eea;
    font-family: 'Playfair Display', serif;
    margin-bottom: 8px;
  }

  .login-header p {
    color: #6b7280;
    font-size: 14px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-weight: 500;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .btn-login {
    width: 100%;
    padding: 12px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    font-size: 14px;
  }

  .btn-login:hover {
    background: #5568d3;
  }

  #login-error {
    display: none;
    background: #fee;
    color: #c33;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 13px;
  }

  /* APP SCREEN */
  #app-screen {
    display: none;
    flex-direction: row;
    min-height: 100vh;
  }

  .sidebar {
    width: 260px;
    background: white;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-header {
    padding: 24px 20px;
    border-bottom: 1px solid #e5e7eb;
  }

  .sidebar-brand {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: #667eea;
  }

  .sidebar-brand-sub {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 4px;
  }

  .tenant-selector {
    margin: 16px 0 0 0;
    padding: 12px;
    background: #f3f4f6;
    border-radius: 8px;
    border: none;
    width: 100%;
    cursor: pointer;
    font-size: 13px;
    color: #374151;
  }

  .sidebar-nav {
    flex: 1;
    padding: 16px 0;
  }

  .sidebar-item {
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 3px solid transparent;
    color: #6b7280;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-item:hover {
    background: #f9fafb;
    color: #667eea;
  }

  .sidebar-item.active {
    background: #f3f4f6;
    border-left-color: #667eea;
    color: #667eea;
    font-weight: 600;
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid #e5e7eb;
  }

  .btn-logout {
    width: 100%;
    padding: 10px;
    background: #fee;
    color: #dc2626;
    border: 1px solid #fca5a5;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.2s;
  }

  .btn-logout:hover {
    background: #fecaca;
  }

  /* MAIN CONTENT */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header-bar {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-bar h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1f2937;
  }

  .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  #edit-toggle {
    padding: 8px 16px;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }

  #edit-toggle.active {
    background: #fef3c7;
    border-color: #fcd34d;
    color: #92400e;
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: #6b7280;
  }

  .user-avatar {
    width: 36px;
    height: 36px;
    background: #667eea;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
  }

  #view-content {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
  }

  /* CALENDAR VIEW */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .calendar-header h2 {
    font-size: 28px;
    font-weight: 700;
  }

  .posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .post-card {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
  }

  .post-card:hover {
    border-color: #667eea;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
  }

  .post-type {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    z-index: 2;
  }

  .post-type-reel {
    background: #fee;
    color: #c33;
  }

  .post-type-carousel {
    background: #efe;
    color: #3c3;
  }

  .post-type-static {
    background: #eef;
    color: #33c;
  }

  .post-card img,
  .post-no-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
  }

  .post-info {
    padding: 16px;
  }

  .post-date {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 6px;
  }

  .post-title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 6px;
    color: #1f2937;
  }

  .post-caption {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.4;
  }

  .post-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .btn-small {
    flex: 1;
    padding: 6px 12px;
    background: #f3f4f6;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-small:hover {
    background: #e5e7eb;
  }

  .btn-small.btn-danger {
    background: #fee;
    color: #c33;
  }

  .btn-small.btn-danger:hover {
    background: #fdd;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #9ca3af;
  }

  /* SETTINGS & ADMIN */
  .settings-panel,
  .admin-panel {
    max-width: 800px;
  }

  .settings-panel h2,
  .admin-panel h2 {
    font-size: 24px;
    margin-bottom: 28px;
  }

  .settings-section,
  .admin-section {
    background: white;
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    margin-bottom: 20px;
  }

  .settings-section h3,
  .admin-section h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: #1f2937;
  }

  .settings-group {
    margin-bottom: 16px;
  }

  .settings-group label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
    font-size: 13px;
    color: #374151;
  }

  .settings-group input,
  .settings-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 13px;
  }

  .settings-group input:focus,
  .settings-group select:focus {
    outline: none;
    border-color: #667eea;
  }

  .tenants-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .tenant-item {
    padding: 12px;
    background: #f9fafb;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid #e5e7eb;
  }

  .tenant-item:hover {
    background: #f3f4f6;
    border-color: #667eea;
  }

  .tenant-name {
    font-weight: 600;
    font-size: 14px;
    color: #1f2937;
  }

  .tenant-meta {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
  }

  .admin-info p {
    padding: 8px 0;
    font-size: 13px;
    color: #6b7280;
  }

  .btn-primary {
    padding: 10px 20px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
    margin-top: 16px;
  }

  .btn-primary:hover {
    background: #5568d3;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .sidebar { width: 200px; }
    .posts-grid { grid-template-columns: 1fr; }
    #view-content { padding: 20px; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-container">
    <div class="login-header">
      <h1>Paleta Editorial</h1>
      <p>Platform de Calendário Editorial Multi-tenant</p>
    </div>

    <form onsubmit="window._handleLogin(event)">
      <div id="login-error"></div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">Paleta</div>
      <div class="sidebar-brand-sub">Editorial Platform</div>
      <select class="tenant-selector" id="tenant-select" onchange="window._switchTenant(this.value)">
        <option>Carregando tenants...</option>
      </select>
    </div>

    <div class="sidebar-nav">
      <div class="sidebar-item active" data-view="calendar" onclick="window._setView('calendar')">
        📅 Calendário
      </div>
      <div class="sidebar-item" data-view="settings" onclick="window._setView('settings')">
        ⚙️ Configurações
      </div>
      <div class="sidebar-item" data-view="admin" onclick="window._setView('admin')">
        👨‍💼 Admin
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="btn-logout" onclick="window._handleLogout()">Logout</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="header-bar">
      <h1 id="view-title">Calendário Editorial</h1>
      <div class="header-actions">
        <button id="edit-toggle" onclick="window._toggleEditMode()">✏️ Modo Edição</button>
        <div class="user-info">
          <span id="user-email">user@email.com</span>
          <div class="user-avatar" id="user-avatar">U</div>
        </div>
      </div>
    </div>

    <div id="view-content">
      Carregando...
    </div>
  </div>
</div>

<script>
  // Atualizar seletor de tenants e info do usuário após carregar
  setTimeout(() => {
    if (window._tenants && window._tenants.length > 0) {
      const select = document.getElementById('tenant-select');
      select.innerHTML = window._tenants.map(t => `
        <option value="${t.id}" ${t.id === window._tenantId ? 'selected' : ''}>${t.name}</option>
      `).join('');
    }

    if (window._user) {
      document.getElementById('login-email').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('user-email').textContent = window._user.email;
      const avatar = document.getElementById('user-avatar');
      avatar.textContent = window._user.email.charAt(0).toUpperCase();
    }
  }, 100);
</script>

</body>
</html>
